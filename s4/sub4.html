<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아디다스 디자인</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">

<style>
    /*리셋*/
html,body { height:100%; }
body,div,p,dl,dt,dd,ul,ol,li,h1,h2,h3,h4,h5,h6,form,fieldset,button,input { margin:0; padding:0; }
body,h1,h2,h3,h4,input,button { font-size:12px; }
ul,li,ol { list-style:none; }
img,fieldset,iframe { border:0; }
img { vertical-align:top; }
table { border-collapse:collapse; }
a {text-decoration: none; color: black;}

#wrap {width: 100%;}


header {position: fixed; width: 100%; height: 84px; }
header .inner {position: relative; margin-left: 100px; width:calc(100% - 200px); height: 84px; border-bottom: 3px solid #68623c ;}
header .logo {position: absolute; left: 0px; top: 16px; width: 222px; height: 53px; }
header ul {position: absolute; right: 0px; top: 55px;  display: flex; width: 787px; justify-content: space-between; }
header ul li a {font-size: 18px; font-family:"Roboto"; font-weight: 700; color: white;}
header ul li a:hover {color: #68623c; transition: 0.4s;}

#visual img {width: 100%;}
#visual .srid .t1 {position: absolute; left: 213px; top: 683px; width: 357px; height: 96px; border: 4px solid white; box-sizing: border-box;}
#visual .srid .t1 p {line-height: 86px; text-align: center; font-size: 26px; font-family: "Noto Sans KR"; font-weight: 400; color: white;}
#visual .s1 {position: absolute; left: 213px; top: 849px; display: flex; height: 20px;}
#visual .s1 li:nth-child(1) {margin-right: 14px;width: 45px; background: #68623c; border-radius: 10px;}
#visual .s1 li:nth-child(2) {margin-left: 14px; margin-right: 14px;width: 20px; background: #7a736e; border-radius: 10px;}
#visual .s1 li:nth-child(3) {margin-left: 14px; margin-right: 14px;width: 20px; background: #7a736e; border-radius: 10px;}

#footer {height: 99px; background: #1e100f;}
#footer p { float: right; margin-right: 100px; margin-top: 43px; color: #68623c; font-size: 17px; font-family:"Roboto"; font-weight: 400;}

</style>
</head>
<body>

<div id="wrap">
<!--////////// header //////////-->
    <header>
        <div class="inner">
            <div class="logo"><a href="#"><img src="images/logo.png" alt=로고></a></div>
            <ul>
                <li><a href="#">men</a></li>
                <li><a href="#">women</a></li>
                <li><a href="#">kids</a></li>
                <li><a href="#">sale</a></li>
            </ul>
        </div>
    </header>
<!--////////// visual //////////-->
    <div id="visual">
        <div class="v_img">
            <img src="images/v1.jpg" alt="">
            <div class="butt"></div>
            <ul class="srid">
                <li class="t1"><a href="#"><p>경험하기</p></a></li>
            </ul>
            <ul class="s1">
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </div>
    </div>

<!--////////// footer //////////-->

    <div id="footer">
        <p>Oltiva Copyright ©2022. All Righrs Reserved</p>
    </div>
</div>
</body>
</html>
